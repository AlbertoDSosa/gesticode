services:
    laravel.test:
        build:
            context: ./docker/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                NODE_VERSION: '22'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8050}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - postgres
    pgadmin:
        image: dpage/pgadmin4
        ports:
            - 8080:80
        depends_on:
            - postgres
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@gesticode.com
            PGADMIN_DEFAULT_PASSWORD: '${DB_PASSWORD:-yalosabes}'
            PGADMIN_CONFIG_SERVER_MODE: 'False'
        volumes:
            - 'sail-pgadmin:/var/lib/pgadmin'
        networks:
            - sail
    postgres:
        image: 'pgvector/pgvector:pg16'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - 'sail-postgres:/var/lib/postgresql/data'
            - './docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - pg_ready -U ${DB_USERNAME} -d ${DB_DATABASE}
            retries: 3
            timeout: 5s
            interval: 10s
networks:
    sail:
        driver: bridge
volumes:
    sail-postgres:
        driver: local
    sail-pgadmin:
        driver: local
